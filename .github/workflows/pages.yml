name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/cozy-rain-blazor-threejs-eb3tkc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish Cozy.csproj -c Release -o out

      # The site lives at https://<user>.github.io/<repo>/, so the base path is the repo name.
      - name: Set base path and add Pages files
        run: |
          cd out/wwwroot
          sed -i "s|<base href=\"/\" />|<base href=\"/${GITHUB_REPOSITORY#*/}/\" />|" index.html
          grep -n "base href" index.html
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
